<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now</title>
    <link rel="stylesheet" href="booknow.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceland&family=Monoton&family=Qwitcher+Grypen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <button class="home"><a href="task4.html" style="color: red";>Home</a></button>
    <div class="book">
        <h2>Book Now</h2>
        <label>Full Name:</label>
        <input type="text" placeholder="Enter Your Full Name" class="inputbox"><br><br>
        <label>Email:</label>
        <input type="email" placeholder="abc@gmail.com" class="inputbox"><br><br>
        <label>Mobile No:</label>
        <input type="tel" placeholder="+91 1234**7890" class="inputbox"><br><br>
        <label>Destination:</label>
        <select class="inputbox">
            <option>Select Your Destination</option>
            <option>Tokyo</option>
            <option>Kyoto</option>
            <option>Osaka</option>
            <option>Mount Fuji</option>
            <option>Hiroshima</option>
            <option>Nara</option>
            <option>Nikko</option>
            <option>Hakone</option>
            <option>Kanazawa</option>
            <option>Shirakawa-go</option>
        </select><br><br>
        <label>Date:</label>
        <input type="date" class="inputbox"><br><br>
        <label>No.Of.Tourists:</label>
        <input type="number" class="inputbox"><br><br>
        <label>Special Requests (Optional): </label>
        <textarea placeholder="Allergies,Vegetarian" class="inputbox" ></textarea><br><br>
        <center><button class="submit">Submit</button></center>
    </div>
</body>
</html>
